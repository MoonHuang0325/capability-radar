name: validate-data

# 数据校验：每次 push / PR 自动检查结构化数据、配置与 LATEST 一致性。
# 没有校验的 schema 只是建议；这个 workflow 让它成为约束。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: python scripts/validate_data.py
