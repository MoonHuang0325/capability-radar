name: radar-watchdog

# 雷达看门狗，每周二 10:30（北京时间）做两件事：
# 1. 同步：LATEST.md 若与最新报告不一致，自动修正并提交（消除双份真相源漂移）
# 2. 报警：最新报告超过 8 天未更新，自动开 issue 提醒（阈值 -ge 8，漏跑次周即报）
# 注：GitHub 会在仓库 60 天无活动时停用 schedule；每周的自动提交本身即活动，可规避。
# 来历：本项目第二期曾因电脑未开机漏跑，三天后才被发现。

on:
  schedule:
    - cron: '30 2 * * 2'  # 周二 02:30 UTC = 北京时间 10:30
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 同步 LATEST.md 到最新报告
        run: |
          set -e
          latest=$(ls reports/ | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' | sort | tail -1)
          if [ -z "$latest" ]; then echo "没有找到报告文件"; exit 1; fi
          if ! cmp -s "reports/$latest" LATEST.md; then
            cp "reports/$latest" LATEST.md
            git config user.name "radar-bot"
            git config user.email "radar-bot@users.noreply.github.com"
            git add LATEST.md
            git commit -m "chore: LATEST.md 同步至 $latest [skip ci]"
            git push
            echo "LATEST.md 已同步至 $latest"
          else
            echo "LATEST.md 已是最新"
          fi

      - name: 检查报告新鲜度，漏跑开 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          latest=$(ls reports/ | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' | sort | tail -1 | sed 's/\.md//')
          latest_ts=$(date -u -d "$latest" +%s)
          now_ts=$(date -u +%s)
          days=$(( (now_ts - latest_ts) / 86400 ))
          echo "最新报告: $latest，距今 ${days} 天"
          if [ "$days" -ge 8 ]; then
            gh label create watchdog --color E11D48 --description "雷达漏跑提醒" 2>/dev/null || true
            existing=$(gh issue list --label watchdog --state open --json number --jq length)
            if [ "$existing" -eq 0 ]; then
              gh issue create \
                --title "📡 雷达漏跑提醒：最新报告已是 ${days} 天前" \
                --body "watchdog 自动创建：reports/ 最新文件为 ${latest}.md，已 ${days} 天未更新。请检查每周定时任务并手动补跑。" \
                --label watchdog
              echo "已创建提醒 issue"
            else
              echo "已有未关闭的 watchdog issue，跳过"
            fi
          else
            echo "报告新鲜，无需处理"
          fi
