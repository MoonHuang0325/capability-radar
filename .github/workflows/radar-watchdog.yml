name: radar-watchdog

# 雷达看门狗，每周二 10:30（北京时间）做三件事：
# 1. 保活：无条件提交 .github/last-check 时间戳——GitHub 会在仓库 60 天无活动时停用
#    schedule，而 LATEST 同步在稳态下不产生提交，没有保活机制看门狗会死在唯一该叫的时候
# 2. 同步：LATEST.md 若与最新报告不一致，自动修正并提交（消除双份真相源漂移）
# 3. 报警：最新报告超过 8 天未更新，自动开 issue（阈值 -ge 8，漏跑次周即报）
# 来历：本项目第二期曾因电脑未开机漏跑，三天后才被发现。

on:
  schedule:
    - cron: '30 2 * * 2'  # 周二 02:30 UTC = 北京时间 10:30
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 保活 + 同步 LATEST.md
        run: |
          set -e
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-check
          latest=$(ls reports/ | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' | sort | tail -1)
          if [ -z "$latest" ]; then echo "没有找到报告文件"; exit 1; fi
          changed=0
          if ! cmp -s "reports/$latest" LATEST.md; then
            cp "reports/$latest" LATEST.md
            changed=1
          fi
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add .github/last-check
          [ "$changed" -eq 1 ] && git add LATEST.md
          git commit -m "chore: watchdog 例行检查 $(date -u +%Y-%m-%d) [skip ci]"
          git push
          echo "保活提交完成；LATEST 变更: $changed"

      - name: 检查报告新鲜度，漏跑开 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          latest=$(ls reports/ | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' | sort | tail -1 | sed 's/\.md//')
          latest_ts=$(date -u -d "$latest" +%s)
          now_ts=$(date -u +%s)
          days=$(( (now_ts - latest_ts) / 86400 ))
          echo "最新报告: $latest，距今 ${days} 天"
          if [ "$days" -ge 8 ]; then
            gh label create watchdog --color E11D48 --description "雷达漏跑提醒" 2>/dev/null || true
            existing=$(gh issue list --label watchdog --state open --json number --jq length)
            if [ "$existing" -eq 0 ]; then
              gh issue create \
                --title "📡 雷达漏跑提醒：最新报告已是 ${days} 天前" \
                --body "watchdog 自动创建：reports/ 最新文件为 ${latest}.md，已 ${days} 天未更新。请检查每周定时任务并手动补跑。" \
                --label watchdog
              echo "已创建提醒 issue"
            else
              echo "已有未关闭的 watchdog issue，跳过"
            fi
          else
            echo "报告新鲜，无需处理"
          fi
